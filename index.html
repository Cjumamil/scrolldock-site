<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/scrolldock-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScrollDock — Scroll the right way, every time.</title>
    <meta
      name="description"
      content="ScrollDock switches your Mac's scroll direction the instant you dock or undock."
    />
    <script>
      (function () {
        var redirect = sessionStorage.redirectPath
        if (redirect) {
          delete sessionStorage.redirectPath
          if (redirect !== location.pathname) {
            history.replaceState(null, '', redirect)
          }
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
